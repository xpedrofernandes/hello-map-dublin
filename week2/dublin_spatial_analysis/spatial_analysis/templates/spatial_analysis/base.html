<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dublin Spatial Analysis{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'spatial_analysis:dashboard' %}">🗺️ Dublin Spatial Analysis</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'map' %}">Map</a>
                <a class="nav-link" href="{% url 'spatial_analysis:dashboard' %}">Dashboard</a>
                <a class="nav-link" href="/admin/">Admin</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    {% block footer %}
    <footer class="border-top py-3 mt-5 text-center text-muted">
        CMPU4058 - Advanced Web Mapping · Dublin City Planning Department
    </footer>
    {% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
